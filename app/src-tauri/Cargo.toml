[package]
name = "pikchard"
version = "0.1.0"
description = "A live editor for Pikchr diagrams"
authors = ["Leonardo Marques"]
license = "MIT"
repository = "https://github.com/reox/pikchard"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The desktop binary and any future mobile target both go through this crate.
name = "pikchard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` is mandatory, not optional: `Image::from_bytes` interprets raw
# bytes as RGBA, so encoded PNG needs the decoder or the clipboard write errors
# (#1055 Q17). The feature is `tauri`'s, not the clipboard plugin's.
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# Help ▸ Pikchr Language Manual opens in the user's own browser, never in the
# app's one window (#1100).
tauri-plugin-opener = "2"

# Load-bearing on all three OSes, because ADR 0010 keeps app state in the
# webview and two instances would share one data directory. `cfg(desktop)` is
# Tauri's own cfg and means nothing to Cargo, so the target is spelled out.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
# Only the config-consistency test reads JSON; commands bring their own deps.
serde_json = "1"
# `test` gives `tauri::test::mock_builder`, so the commands can be exercised
# with a real `AppHandle` and a real fs scope rather than only their helpers.
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
